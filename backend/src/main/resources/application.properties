server.port=8080
management.endpoints.web.exposure.include=health,info

# Database credentials are injected at runtime via environment variables
# (see docker-compose.yml and .env) — never hardcoded here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=org.postgresql.Driver
